overlay_autocompile_cmd = "python3 psxrecomp/tools/compile_overlays.py --captures build-release/overlay_captures.json --game-toml game.toml --recompiler build-recompiler/psxrecomp-game --runtime-include psxrecomp/runtime/include --out-dir build-release/cache"

